name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
    - name: Checkout Code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4 pinned SHA

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v4 pinned SHA
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore FlowAD.slnx

    - name: Build Solution
      run: dotnet build FlowAD.slnx --configuration Release --no-restore

    - name: Run Unit Tests
      run: dotnet test FlowAD.slnx --configuration Release --no-build --verbosity normal
